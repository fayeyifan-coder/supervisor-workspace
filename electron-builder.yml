appId: cn.supervisorworkspace.desktop.mvp
productName: Supervisor Workspace MVP
executableName: SupervisorWorkspace-MVP
directories:
  output: release
files:
  - build/**/*.js
  - dist/**/*
  - "!**/node_modules/**/*"
extraResources:
  - from: build/recovery-io.exe
    to: recovery-io.exe
asar: true
npmRebuild: false
win:
  target:
    - dir
  signAndEditExecutable: false
  artifactName: SupervisorWorkspace-MVP-${version}-win-${arch}.${ext}
