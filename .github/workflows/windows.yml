name: Windows verification

on:
  push:
    branches: [main, fix/v0.2.1-maintenance, m2-b/reliability-proof, m2-c/student-growth-profile, m2-d/offline-data-protection, v0.2/r2-a-operations-protection, v0.2/r2-b-weekly-schedule, v0.2/r2-b-attendance-learning, v0.2/r2-c-workday-acceptance, v0.2/r3-a-unified-student-detail, v0.2/release-hardening, v0.2/production-admission]
  pull_request:
    branches: [main, pr/1a-windows-desktop-shell, mvp/v0.1, m2-b/daily-work-log, m2-b/reliability-proof, m2-c/student-growth-profile, m2-c/student-json-import, m2-d/offline-data-protection, v0.2/r2-a-operations-protection, v0.2/r2-b-weekly-schedule, v0.2/r2-b-attendance-learning, v0.2/r2-c-workday-acceptance, v0.2/r3-a-unified-student-detail, v0.2/release-hardening, release/batch1-maintenance-ux, chore/controlled-release]

permissions:
  contents: read

jobs:
  windows:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify development Node
        run: npm run preflight
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test database
        run: npm test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
      - name: Build desktop application
        run: npm run build
      - name: Package and verify the MVP desktop preview
        id: portable
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        env:
          MVP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MVP_TOOLING_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $sourceCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $sourceCommit -cne $env:MVP_HEAD_SHA) {
            throw 'The checked-out source does not match the PR head.'
          }
          $kind = if (($env:GITHUB_HEAD_REF -in @('m2-b/daily-work-log', 'm2-b/reliability-proof')) -or
            ($env:GITHUB_REF_NAME -eq 'm2-b/reliability-proof')) { 'm2b' } elseif (($env:GITHUB_HEAD_REF -eq 'm2-c/student-growth-profile') -or
              ($env:GITHUB_REF_NAME -eq 'm2-c/student-growth-profile')) { 'm2c' } elseif (
                $env:GITHUB_HEAD_REF -eq 'm2-c/student-json-import') { 'm2c3' } elseif (
                $env:GITHUB_HEAD_REF -eq 'm2-d/offline-data-protection' -or
                $env:GITHUB_REF_NAME -eq 'm2-d/offline-data-protection') { 'm2d' } elseif (
                  $env:GITHUB_HEAD_REF -eq 'v0.2/r2-a-operations-protection' -or
                  $env:GITHUB_REF_NAME -eq 'v0.2/r2-a-operations-protection') { 'r2a' } elseif (
                  $env:GITHUB_HEAD_REF -eq 'v0.2/r2-b-weekly-schedule' -or
                  $env:GITHUB_REF_NAME -eq 'v0.2/r2-b-weekly-schedule') { 'r2b' } elseif (
                    $env:GITHUB_HEAD_REF -eq 'v0.2/r2-b-attendance-learning' -or
                    $env:GITHUB_REF_NAME -eq 'v0.2/r2-b-attendance-learning') { 'r2b2' } elseif (
                      $env:GITHUB_HEAD_REF -eq 'v0.2/r2-c-workday-acceptance' -or
                      $env:GITHUB_REF_NAME -eq 'v0.2/r2-c-workday-acceptance') { 'r2c' } elseif (
                        $env:GITHUB_HEAD_REF -eq 'v0.2/r3-a-unified-student-detail' -or
                        $env:GITHUB_REF_NAME -eq 'v0.2/r3-a-unified-student-detail') { 'r3a' } else { 'mvp' }
          $root = Join-Path $env:RUNNER_TEMP "supervisor-$kind-portable-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw 'Portable output directory already exists.' }
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          $appInput = Join-Path $root 'app-input'
          New-Item -ItemType Directory -Path $appInput -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath 'build', 'dist' -Destination $appInput -Recurse -ErrorAction Stop
          $package = Get-Content -Raw -LiteralPath 'package.json' | ConvertFrom-Json
          [ordered]@{
            name = $package.name
            version = $package.version
            description = $package.description
            author = $package.author
            main = $package.main
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $appInput 'package.json') -Encoding utf8NoBOM
          $lock = Get-Content -Raw -LiteralPath 'package-lock.json' | ConvertFrom-Json -AsHashtable
          $electronVersion = $lock.packages['node_modules/electron'].version
          npm run pack:win:dir -- "--config.directories.app=$appInput" "--config.directories.output=$root" "--config.electronVersion=$electronVersion"
          if ($LASTEXITCODE -ne 0) { throw 'Unpacked Windows build failed.' }
          New-Item -ItemType Directory -Path (Join-Path $root 'deploy') -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath 'deploy/Production-Admission.ps1' -Destination (Join-Path $root 'deploy') -ErrorAction Stop

          $env:MVP_PORTABLE_ROOT = $root
          $exe = Get-Item -LiteralPath (Join-Path $root 'win-unpacked\SupervisorWorkspace-MVP.exe') -ErrorAction Stop
          $env:MVP_ELECTRON_FILE_VERSION = $exe.VersionInfo.ProductVersion
          node scripts/verify-portable.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Portable application verification failed.' }
          "root=$root" >> $env:GITHUB_OUTPUT
          "kind=$kind" >> $env:GITHUB_OUTPUT
      - name: Smoke-test packaged Electron on an isolated profile
        run: node scripts/smoke-electron.cjs (Join-Path '${{ steps.portable.outputs.root }}' 'win-unpacked/SupervisorWorkspace-MVP.exe')
